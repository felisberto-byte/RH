name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint e tipos
        run: |
          ruff check src tests migrations
          ruff format --check src tests
          mypy src
      - name: Testes (SQLite)
        run: pytest
      - name: Migrações no PostgreSQL (CLI upgrade/check/downgrade)
        env:
          PORTAL_ENV: test
          PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@localhost:5432/portal
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Testes (PostgreSQL; inclui gatilhos e privilégios da migração)
        env:
          PORTAL_TEST_DATABASE_URL: postgresql+psycopg://portal:portal@localhost:5432/portal
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portal-colaborador:ci .
